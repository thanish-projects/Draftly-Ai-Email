services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: email_drafting_agent
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - email-drafting-agent-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  email-drafting-agent-data:
