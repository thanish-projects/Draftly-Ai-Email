spring.config.import=optional:file:.env[.properties]
spring.application.name=email-drafting-agent
server.port=${PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/email_drafting_agent}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

openai.base-url=${OPENAI_BASE_URL:https://openai.generative.engine.capgemini.com/v1}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_CHAT_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}
openai.max-retries=${OPENAI_MAX_RETRIES:2}
openai.retry-delay-millis=${OPENAI_RETRY_DELAY_MILLIS:250}
